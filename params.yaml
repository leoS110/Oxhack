  - [0.75, 0.75, 0.25, 0.25, 0.50, 0.25, 0.25, 0.25, 0.25, 0.50, 0.25, 0.25, 0.00, 0.25, 0.50, 0.25, 0.50, 0.25, 0.25, 0.50, 0.25]
  - [0.50, 0.50, 0.50, 0.25, 0.25, 0.50, 0.50, 0.25, 0.00, 0.25, 0.50, 0.50, 0.25, 0.00, 0.25, 0.50, 0.25, 0.50, 0.25, 0.25, 0.25]
  - [0.50, 0.25, 0.75, 0.50, 0.25, 0.75, 0.75, 0.50, 0.25, 0.25, 0.75, 0.75, 0.50, 0.25, 0.00, 0.75, 0.25, 0.50, 0.25, 0.25, 0.25]
  - [1.00, 1.00, 0.50, 0.50, 0.75, 0.25, 0.25, 0.25, 0.50, 0.75, 0.00, 0.00, 0.25, 0.50, 0.75, 0.00, 0.75, 0.25, 0.50, 0.50, 0.50]
  - [0.75, 0.50, 0.75, 0.50, 0.25, 0.75, 0.75, 0.50, 0.25, 0.25, 0.75, 0.75, 0.50, 0.25, 0.25, 0.75, 0.00, 0.50, 0.25, 0.25, 0.50]
  - [1.00, 0.75, 0.50, 0.50, 0.75, 0.25, 0.25, 0.25, 0.50, 0.50, 0.25, 0.25, 0.25, 0.50, 0.50, 0.25, 0.50, 0.00, 0.50, 0.50, 0.50]
  - [0.75, 0.75, 0.50, 0.50, 0.50, 0.75, 0.50, 0.50, 0.25, 0.25, 0.50, 0.50, 0.25, 0.25, 0.25, 0.50, 0.25, 0.50, 0.00, 0.00, 0.50]
  - [0.75, 0.75, 0.75, 0.50, 0.50, 0.75, 0.75, 0.50, 0.25, 0.25, 0.75, 0.50, 0.50, 0.25, 0.25, 0.50, 0.25, 0.50, 0.00, 0.00, 0.50]
  - [0.50, 0.50, 0.25, 0.00, 0.50, 0.50, 0.25, 0.25, 0.25, 0.25, 0.50, 0.25, 0.25, 0.25, 0.25, 0.50, 0.50, 0.50, 0.50, 0.50, 0.00]

crops:
  wheat:
    price_gbp_per_t: 196.2   # Ex-farm, Wed 14 Oct 2026, merchant data collected by Farmers Weekly (fwi.co.uk, "English barley harvest falls to 14-year low as wheat edges higher", 15 Oct 2026). Delivery month not stated.
    yield_t_per_ha: 6.9      # AHDB final harvest report, 25 Sep 2026: UK survey average, wheat
    yield_moisture_pct: 14.5 # Scottish Government harvest methodology: cereal yields adjusted to 14.5%. ASSUMPTION that the AHDB figure uses the same basis; AHDB does not state one.
    target_moisture_pct: 14.0       # Camgrain 2025/2026: cereals dry to 14%
    free_drying_up_to_pct: 15.0     # Camgrain 2025/2026: cereal drying free below 15.1%
  barley:
    price_gbp_per_t: 182.6   # same source, date and basis as wheat (feed barley)
    yield_t_per_ha: 6.9      # AHDB final harvest report, 25 Sep 2026: UK survey average, WINTER barley (spring barley was 4.8)
    yield_moisture_pct: 14.5 # as wheat
    target_moisture_pct: 14.0
    free_drying_up_to_pct: 15.0
  osr:
    price_gbp_per_t: 468.0   # AHDB Arable Market Report 19 Oct 2026: delivered Erith, Nov-26, Friday survey. DELIVERED, not ex-farm (no ex-farm OSR price found), so it overstates what a farmer receives.
    yield_t_per_ha: 4.0      # AHDB final harvest report, 25 Sep 2026: UK survey average, oilseed rape
    yield_moisture_pct: 9.0  # Scottish Government harvest methodology: oilseed rape adjusted to 9.0%. ASSUMPTION that the AHDB figure uses the same basis.
    target_moisture_pct: 9.0        # Camgrain 2025/2026: oilseeds dry to 9%
    free_drying_up_to_pct: 9.0      # Camgrain 2025/2026: oilseed drying free below 9.1%

# Value function (harvest/value.py). Drying charges from Camgrain 2025/2026, harvest 2026
# (https://www.camgrain.co.uk/charges-for-2025). The drying target and the free level are per crop
# (target_moisture_pct, free_drying_up_to_pct under crops: above); the oilseed values come from the
# same Camgrain page. The band, the charge per band and the weight deduction are the same for both.
weight_loss_pct_per_pct: 1.25      # weight deducted per point dried
drying_band_pct: 0.5
drying_charge_gbp_per_band: 2.0    # per tonne
max_harvest_moisture_pct: 25       # too wet to combine above this
min_moisture_pct: 12
drying_pct_per_hour: 0.3           # in dry air, scaled by (100 - humidity) / 100
rewetting_pct_per_mm: 0.5
rain_limit_mm: 0.2                 # no cutting in an hour wetter than this
loss_pct_per_hour: 0.015           # crop value lost per hour left standing. 0.015 %/h, chosen by the project owner; sits at the top of the overlap of Bolland 1984, Aust. J. Exp. Agric. 24: 391-395 (0.18-0.75 %/day = 0.0075-0.031 %/h) and the BCG Australian barley trial (0.001-0.015 %/h). No oilseed-specific source.

# Running costs (harvest/simulate.py): what every plan is scored with, per combine-hour.
#   cutting: diesel + operator + repairs     driving: diesel + operator + escort + repairs
#   waiting in a field: operator only        at the depot: nothing
running_costs:
  diesel_gbp_per_litre: 1.00           # red diesel ex VAT, UK average June 2026
  cutting_diesel_litres_per_ha: 15     # published figures run 11-20 l/ha
  road_diesel_litres_per_hour: 20      # ~12 mph at ~1 l/km (Masek et al. 2015)
  operator_gbp_per_hour: 19            # ~£15/h pay plus employer NI and holiday pay
  road_escort_gbp_per_hour: 25         # required over 3.5 m wide; pay plus their vehicle
  repairs_gbp_per_engine_hour: 31      # 23% of a £400k list price over 3,000 h (Calcante et al. 2013)

# Fuel (harvest/simulate.py). Each combine's tank burns the litres above (per ha cut, per hour on
# the road; nothing while waiting, engine off) and is filled only at the depot. The simulator sends
# a combine home when one more hour of cutting would leave too little to get back.
depot_refuel_litres_per_hour: 2400   # 40 l/min, the low end of farm tank pumps (40-70 l/min rated)
fuel_reserve_pct: 10                 # of the tank, still in it on reaching the depot. Our choice

# Planner costs: rough numbers the planners steer by. Scoring uses running_costs.
idle_in_field_gbp_per_hour:  19
drive_gbp_per_hour: 95
depot_when_idle: true              # send idle combines home if cheaper (every planner but mpc)
depot_margin_gbp: 20               # only if it saves more than this

# plan_farmer: the baseline, a farmer's day without our models (harvest/planners/README_farmer.md).
# All our guesses at what farmers do, no sources yet.
farmer_day_start_hour: 9           # UTC (10:00 BST), once the dew is off: the day's one decision, on the latest reading
farmer_day_hours: 12               # most a combine is out in a day: leaves the yard at the start, back by the end
farmer_fit_above_target_pct: 4     # cuts a field read at most this above its crop's target_moisture_pct (cereals 18%, oilseed rape 13%)
farmer_max_wet_hours: 4            # stays in the yard all day if the forecast has more hours than this too wet to cut (rain_limit_mm) in the working day

# plan_lagrangian
lagrangian_iterations: 300
lagrangian_first_step_gbp_per_ha: 50  # step k is this / k
lagrangian_wait_margin_gbp_per_ha: 5  # only wait for a later hour if it gains this much

# plan_mpc
mpc_scenarios: 50                  # forecast members each plan is scored in; 0 = mean only
mpc_rounds: 5                      # route re-plans per combine
mpc_route_passes: 3                # tries per re-plan
mpc_terminal_hours: 24             # grain left at the end is worth its mean value over these hours,
mpc_terminal_value_pct: 100        # times this

# Grain moisture model (harvest/moisture.py), writes outputs/moisture_forecast.csv.
# °C, RH as a fraction, moisture dry basis (kg/kg).
moisture_model:
  gas_constant_j_per_mol_k: 8.314
  kelvin_offset: 273.15
  rh_min: 0.05                     # Henderson blows up as RH -> 1
  rh_max: 0.95
  # A rain hour replaces drying with a capped rise (Smith, Bailey & Ingram 1981, eqns 6a, 6b):
  #   m = min(m + rain_rise_per_hour * rain_rise_scale, rain_max_mc)
  rain_rise_per_hour: 0.028
  rain_max_mc: 0.52                # ~34% wet basis
  rain_threshold_mm: 0.3           # our choice, not from the paper
  # EMC (modified Henderson) fitted to the PAMI charts; drying rate (Lewis, Arrhenius) from
  # Noroña et al. dryer tests at 40-60 °C. start_moisture_pct (% wet basis): every field's grain
  # moisture at hour 0 in run.py and replay.py, by crop. Placeholders until there is a real reading.
  crops:
    wheat:  {henderson_k: 2.2846e-5, henderson_c: 55.990,  henderson_n: 2.2876,
             k_ref_per_hour: 0.1255, t_ref_c: 40, ea_j_per_mol: 50630, start_moisture_pct: 10,
             rain_rise_scale: 1.0}
    barley: {henderson_k: 2.2451e-5, henderson_c: 197.489, henderson_n: 2.0160,
             k_ref_per_hour: 0.1653, t_ref_c: 40, ea_j_per_mol: 55890, start_moisture_pct: 10,
             rain_rise_scale: 1.0}
    # Oilseed rape: k_ref copied from wheat, rain response assumed the same as barley.
    osr:    {henderson_k: 5.0569e-4, henderson_c: 39.978,  henderson_n: 1.5714,
             k_ref_per_hour: 0.126,  t_ref_c: 40, ea_j_per_mol: 28470, start_moisture_pct: 8,
             rain_rise_scale: 1.0}

# Made-up weather for scripts/plot_moisture_demo.py and scripts/moisture_sensitivity.py
moisture_demo:
  days: 7
  mean_temp_c: 15
  temp_swing_c: 6                  # daily swing either side of the mean
  warmest_hour: 15                 # also the driest
  mean_rh: 0.75
  rh_swing: 0.18
  rain_spells: [[60, 3], [110, 6]] # [start hour, length]
  rain_mm_per_hour: 1.0
  ea_range_j_per_mol: [30000, 55000]
  ea_steps: 6
  k_ref_scales: [0.5, 1.5]

# Values tried by scripts/rain_sensitivity.py
rain_sensitivity:
  thresholds_mm: [0.0, 0.3, 0.5]
  osr_rain_rise_scales: [0, 0.75, 1.0]
